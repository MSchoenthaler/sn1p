<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sn1p</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header>
  <h1><a href="/">sn1p</a></h1>
  <div class="doc-name" id="doc-name"></div>
  <div class="actions">
    <div class="password-controls">
      <div class="password-unlock-row" id="password-unlock-row">
        <label title="Password is never sent to the server">
          Password:
          <input type="password" id="password" autocomplete="off" data-1p-ignore="true" />
        </label>
        <button id="unlock-btn" type="button">Unlock</button>
      </div>

      <div class="password-change-shell" id="password-change-shell" hidden>
        <button id="wrap-toggle" class="icon-toggle" type="button" title="Enable wrap text" aria-label="Enable wrap text"></button>
        <button id="spellcheck-toggle" class="icon-toggle" type="button" title="Enable spell check" aria-label="Enable spell check" aria-pressed="false"></button>
        <button id="theme-toggle" class="icon-toggle" type="button" title="Switch to light mode" aria-label="Switch to light mode"></button>
        <button id="change-password-toggle" type="button">Change password</button>
        <div class="password-change-panel" id="password-change-panel" hidden>
          <input type="password" id="new-password" placeholder="New password" autocomplete="off" data-1p-ignore="true" />
          <button id="apply-password-btn" type="button">Apply</button>
          <button id="cancel-password-btn" type="button">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="workspace">
  <aside class="sidebar">
    <div class="sidebar-heading">Explorer</div>
    <div class="search-field">
      <input id="tab-search" type="search" placeholder="Search all tabs..." aria-label="Search tab contents and names" autocomplete="off" spellcheck="false" disabled />
      <button id="search-clear" type="button" title="Clear search" aria-label="Clear search" hidden>&times;</button>
    </div>
    <div id="search-controls" class="search-controls" hidden>
      <span id="search-summary" role="status" aria-live="polite"></span>
      <button id="search-previous" type="button" title="Previous match" aria-label="Previous match">&uarr;</button>
      <button id="search-next" type="button" title="Next match" aria-label="Next match">&darr;</button>
    </div>
    <div id="search-results" class="search-results" role="region" aria-label="Search results" hidden></div>
    <nav id="tabs" class="tabs"></nav>
  </aside>

  <main>
    <div id="locked-hint" class="locked-hint">&#128274; Enter a password to start editing.</div>
    <div class="editor-shell">
      <div id="line-numbers" class="line-numbers" aria-hidden="true">1</div>
      <textarea id="editor" placeholder="Type here..." wrap="off" spellcheck="false"></textarea>
      <div id="editor-search-highlights" aria-hidden="true" hidden></div>
    </div>
    <pre id="printable" class="printable"></pre>
  </main>
</div>

<footer>
  <span id="status"></span>
  <span id="editing-status" role="status" aria-live="polite"></span>
</footer>

<script src="/search.js"></script>
<script src="/app.js"></script>
</body>
</html>
